name = "cp-share-worker"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

# Custom domain — set up in Cloudflare dashboard or via wrangler.toml routes
routes = [
  { pattern = "api.cpshare.dsainvg.me/*", custom_domain = true }
]

[[d1_databases]]
binding       = "DB"
database_name = "cpques_db"
database_id   = "6bddb8ee-c114-40fe-9b60-fe77a2a19261"

[vars]
# Non-secret vars go here. Secrets are set via `wrangler secret put`.
# ADMIN_SECRET — set with: wrangler secret put ADMIN_SECRET

[observability]
enabled = true
