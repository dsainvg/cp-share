name = "cp-share-worker"
main = "src/index.ts"
compatibility_date = "2024-07-25"
compatibility_flags = ["nodejs_compat"]

# ── Custom domain ─────────────────────────────────────────────
# Set this up in: Workers & Pages → your worker → Settings → Domains & Routes
routes = [
  { pattern = "api.cpshare.dsainvg.me/*", custom_domain = true }
]

# ── D1 Database ───────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "cpques_db"
database_id   = "6bddb8ee-c114-40fe-9b60-fe77a2a19261"

# ── Build (used by Cloudflare Git integration) ────────────────
# When the dashboard builds from Git, it runs this command first,
# then runs `wrangler deploy` automatically.
# Root directory in dashboard must be set to: backend
[build]
command = "cd .. && npm install && npm run build --workspace=@cp-share/shared"

# ── Secrets (managed in dashboard, NOT here) ─────────────────
# Workers & Pages → your worker → Settings → Variables and Secrets
# Add secret: ADMIN_SECRET

[observability]
enabled = true
