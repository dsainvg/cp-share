name: Deploy Worker to api.dsainvg.me

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # allow manual trigger

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node setup ────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install workspace deps ────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 4. Apply D1 migrations ───────────────────────────────
      # Runs schema.sql against the remote D1 database.
      # Safe to run repeatedly — all statements use IF NOT EXISTS.
      - name: Apply D1 schema migrations
        working-directory: backend
        run: npx wrangler d1 execute cpques_db --file=schema.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── 5. Deploy worker ─────────────────────────────────────
      - name: Deploy Worker
        working-directory: backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
